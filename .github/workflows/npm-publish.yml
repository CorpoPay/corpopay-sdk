name: npm-publish

on:
  push:
    tags:
      - 'v*'
      - 'corpopay-sdk-v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag to publish under'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.5.1, which npm trusted publishing requires.
          # Node 22 ships npm 10 and cannot perform the OIDC exchange.
          node-version: 24
          registry-url: https://registry.npmjs.org
      # actions/setup-node v4 writes a placeholder stub into .npmrc
      # (_authToken=XXXXX-XXXXX-XXXXX-XXXXX) when registry-url is set. Stripping it
      # lets npm fall back to the OIDC trusted-publishing exchange instead of
      # attempting to authenticate with a bogus token.
      - name: Strip placeholder npm token
        run: |
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
      - run: npm ci
      - run: npm run generate
      - run: npm run build
      - run: npm publish --tag "${{ inputs.dist_tag || 'latest' }}"
